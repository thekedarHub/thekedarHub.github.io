<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thekedar Hub</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; }
        .container { max-width: 100%; margin: 0 auto; padding: 0 16px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .pb-nav { padding-bottom: 80px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        
        function App() {
            const [currentPage, setCurrentPage] = useState('home');
            
            const mockPosts = [
                {
                    id: 1,
                    title: "Modern Kitchen Renovation",
                    contractor: "Rajesh Kumar",
                    date: "2 days ago",
                    hashtags: ["kitchen", "renovation"],
                    image: "https://images.unsplash.com/photo-1556909114-f6e7ad7d3136?w=400",
                    upvotes: 24
                }
            ];
            
            return (
                <div className="pb-nav">
                    {currentPage === 'home' && (
                        <div className="container" style={{paddingTop: '20px'}}>
                            <h1 style={{textAlign: 'center', marginBottom: '24px', fontSize: '24px', fontWeight: '700'}}>
                                Thekedar Hub
                            </h1>
                            {mockPosts.map(post => (
                                <div key={post.id} className="card" style={{marginBottom: '16px', overflow: 'hidden'}}>
                                    <div style={{padding: '16px'}}>
                                        <h3>{post.title}</h3>
                                        <p style={{color: '#6c757d', fontSize: '14px'}}>by {post.contractor} • {post.date}</p>
                                        <div style={{margin: '8px 0'}}>
                                            {post.hashtags.map(tag => (
                                                <span key={tag} style={{background: '#e9ecef', padding: '4px 8px', borderRadius: '12px', fontSize: '12px', marginRight: '8px'}}>
                                                    #{tag}
                                                </span>
                                            ))}
                                        </div>
                                    </div>
                                    <img src={post.image} alt={post.title} style={{width: '100%', height: '200px', objectFit: 'cover'}} />
                                    <div style={{padding: '16px', display: 'flex', justifyContent: 'space-between'}}>
                                        <span>👍 {post.upvotes}</span>
                                        <button className="btn btn-primary">Book Now</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                    
                    <nav className="bottom-nav">
                        <button onClick={() => setCurrentPage('home')} style={{background: 'none', border: 'none', color: currentPage === 'home' ? '#667eea' : '#6c757d'}}>
                            🏠 Home
                        </button>
                        <button onClick={() => setCurrentPage('search')} style={{background: 'none', border: 'none', color: currentPage === 'search' ? '#667eea' : '#6c757d'}}>
                            🔍 Search
                        </button>
                        <button onClick={() => setCurrentPage('jobs')} style={{background: 'none', border: 'none', color: currentPage === 'jobs' ? '#667eea' : '#6c757d'}}>
                            💼 Jobs
                        </button>
                        <button onClick={() => setCurrentPage('profile')} style={{background: 'none', border: 'none', color: currentPage === 'profile' ? '#667eea' : '#6c757d'}}>
                            👤 Profile
                        </button>
                    </nav>
                </div>
            );
        }
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
